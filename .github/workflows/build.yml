name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Steinberg VST 3 SDK (MIT license)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
      - name: Configure (Visual Studio 2022, toolset v143 = Windows 7-kompatibel)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DTRUEPAN_VST3_SDK="${{ github.workspace }}/vst3sdk"
      - name: Build (VST2 + VST3; Steinbergs validator körs på VST3-versionen)
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check Windows 7 compatibility (no newer system DLLs or functions)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          $files = @("build\Release\TruePan.dll", "build\VST3\Release\TruePan.vst3\Contents\x86_64-win\TruePan.vst3")
          foreach ($f in $files) {
            Write-Host "== $f"
            $deps = & $dumpbin.FullName /dependents $f
            $deps
            if ($deps -match "api-ms-win|VCRUNTIME|MSVCP|ucrtbase") { throw "$f needs DLLs that Windows 7 may lack" }
            $imports = & $dumpbin.FullName /imports $f
            if ($imports -match "GetSystemTimePreciseAsFileTime|CreateFile2|GetCurrentThreadStackLimits|PathCch|SetThreadDescription|WaitOnAddress|WakeByAddress|GetOverlappedResultEx") {
              throw "$f uses Windows functions that Windows 7 lacks"
            }
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\TruePan.dll dist\
          Copy-Item -Recurse build\VST3\Release\TruePan.vst3 dist\
          Copy-Item LICENSE-VST3-SDK.txt dist\
          Get-ChildItem -Recurse dist | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: TruePan-win64
          path: dist
      - name: Render GUI screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Push-Location shots
          & ..\build\Release\RenderGui.exe
          if ($LASTEXITCODE -ne 0) { throw "RenderGui failed" }
          # Bilderna även som text i loggen (base64), så att de kan hämtas utan nedladdning
          foreach ($f in @("TruePan_front.png", "TruePan_back.png")) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $f)))
            Write-Host "IMGBEGIN $f"
            for ($i = 0; $i -lt $b64.Length; $i += 2000) { Write-Host ("IMG " + $b64.Substring($i, [Math]::Min(2000, $b64.Length - $i))) }
            Write-Host "IMGEND $f"
          }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: TruePan-screenshots
          path: shots
